name: Staging E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      TASKAVIA_E2E_PROJECT_REF: ${{ secrets.E2E_SUPABASE_PROJECT_REF }}
      TASKAVIA_E2E_ALLOW_REMOTE_WRITE: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PAYMENTS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build:next
      - name: Run browser flow
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
